services:
  - type: web
    name: webos-subscription
    runtime: python
    plan: free
    region: singapore
    branch: master
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.master:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
